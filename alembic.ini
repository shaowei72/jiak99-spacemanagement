# Alembic settings: database migrations for apps/api (see "API and database" in README.md).
#
# Run from the repo root:
#   uv run alembic upgrade head                                 # bring the database up to date
#   uv run alembic revision --autogenerate -m "add no_show"     # draft a migration after editing models.py
#
# The database comes from the DATABASE_URL environment variable (default: the local SQLite dev file),
# so there is deliberately no sqlalchemy.url here.

[alembic]
# "package:folder" - the migrations live inside the jiak_api package so they ship with the app.
script_location = jiak_api:migrations

# New migration files are named e.g. 20261108_1a2b3c4d5e6f_add_no_show.py, so they sort by date.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Ruff tidies each new migration file, so it passes `ruff check` and `ruff format --check`.
[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
