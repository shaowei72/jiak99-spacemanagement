[project]
name = "graph"
version = "0.1.0"
description = "Outlook calendar access for the zone capacity app: gateway (real + fake) and event formats"
requires-python = ">=3.13"
dependencies = ["engine"]

[tool.uv.sources]
engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph"]
