[project]
name = "jiak-cli"
version = "0.1.0"
description = "Command-line tool to try the engine with real enquiries (MVP 0)"
requires-python = ">=3.13"
dependencies = ["engine"]

[project.scripts]
check = "jiak_cli.check:main"
scenarios = "jiak_cli.scenarios:main"

[tool.uv.sources]
engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiak_cli"]
