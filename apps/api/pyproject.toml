[project]
name = "jiak-api"
version = "0.1.0"
description = "JSON API, web pages and database for the Jiak99 zone capacity app"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "engine",
    "fastapi>=0.162.1",
    "graph",
    "jiak-cli",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
seed = "jiak_api.seed:main"
import-outlook = "jiak_api.import_outlook:main"
anonymise-ics = "jiak_api.anonymise_ics:main"

[tool.uv.sources]
engine = { workspace = true }
graph = { workspace = true }
jiak-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiak_api"]
