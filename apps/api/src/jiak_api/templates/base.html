<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Jiak99{% endblock %} · Jiak99</title>
  {# HTMX normally ignores error answers. Show 409 (no longer fits) and 422 (form mistakes):
     they carry a message for the user. Other errors are still ignored. #}
  <meta name="htmx-config" content='{"responseHandling": [
    {"code": "204", "swap": false},
    {"code": "[23]..", "swap": true},
    {"code": "409", "swap": true, "error": false},
    {"code": "422", "swap": true, "error": false},
    {"code": "[45]..", "swap": false, "error": true}
  ]}'>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <span class="brand">Jiak99</span>
    <nav>
      <a href="/enquiry">Check and book</a>
      <a href="/bookings">Bookings</a>
      <a href="/ops">Day plan</a>
      <a href="/calendar">Calendar</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
