[project]
name = "jiak99"
version = "0.1.0"
description = "Zone capacity app for Jiak99 (uv workspace root)"
requires-python = ">=3.13"
dependencies = ["engine", "jiak-cli", "jiak-api"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
engine = { workspace = true }
jiak-cli = { workspace = true }
jiak-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]

[tool.coverage.run]
source = ["engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line length: `ruff format` wraps code; long message strings stay readable
    "RUF001", "RUF002", "RUF003",  # en dashes, "·" and "×" are intentional in messages
]

[tool.ruff.lint.isort]
known-first-party = ["engine", "engine_helpers", "jiak_cli", "jiak_api"]

[tool.mypy]
strict = true
files = ["packages/engine/src", "apps/cli/src", "apps/api/src"]
plugins = ["pydantic.mypy"]
